url: https://newgraphenvironment.github.io/fly/
template:
  bootstrap: 5

reference:
- title: Estimate footprints
  desc: The ground a photo covers, from its catalogue record, optionally with an elevation model.
  contents:
  - fly_footprint
  - fly_camera_patb
  - fly_summary
- title: Choose photos for an area
  desc: Which photos cover an area of interest, how much, and a small set that covers it.
  contents:
  - fly_filter
  - fly_select
  - fly_coverage
  - fly_overlap
- title: Download
  contents:
  - fly_fetch
- title: Georeference
  desc: Warp a scan onto its estimated footprint, with the black border masked.
  contents:
  - fly_georef
  - fly_bearing
  - fly_mask
  - fly_rotation_calibrate
